# Builds the Windows and Linux zips and publishes them as a GitHub Release.
# Runs on every push to main: when package.json carries a version that has no
# release yet (bump the version and add its CHANGELOG section), it builds and
# publishes v<version>, creating the tag on that commit. Otherwise it does nothing.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v6.0.1'
        required: true

permissions:
  contents: write

# two quick pushes never race to publish the same release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every push, on a real Windows: the now-playing bridge, the built program starting once, and its
  # updates (install, rescue of a broken version, a damaged package, a new engine). A release is only
  # published when this passes.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 20

      - name: Check the scripts
        run: node scripts/check.mjs

      - name: The now-playing bridge (Windows PowerShell 5.1, as Deck 90 runs it)
        shell: powershell
        run: .\scripts\test-media.ps1

      - name: Build the Windows program
        run: node scripts/package.mjs win32

      - name: Start it once
        shell: pwsh
        run: |
          $env:DECK90_SMOKE = '1'
          $env:DECK90_SMOKE_OUT = "$env:RUNNER_TEMP\smoke.txt"
          $p = Start-Process -FilePath "dist\Deck 90-win32-x64\Deck 90.exe" -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\deck90-smoke" -PassThru
          $null = $p.Handle   # keeps the exit code readable
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Deck 90 did not finish its start check in 2 minutes' }
          $line = Get-Content "$env:RUNNER_TEMP\smoke.txt" -ErrorAction SilentlyContinue
          Write-Host "exit code $($p.ExitCode): $line"
          Get-Content "$env:RUNNER_TEMP\deck90-smoke\media.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -or "$line" -notmatch 'DECK90_SMOKE ok') { exit 1 }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null; if ($LASTEXITCODE) { exit 1 } }
          $version = node -p "require('./package.json').version"
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=..\dist\Deck 90-win32-x64" "/DOutputDir=..\dist" installer\deck90.iss
          if ($LASTEXITCODE) { exit 1 }
          Get-Item "dist\Deck-90-$version-setup.exe" | Format-List Name, Length

      - name: Install, start and uninstall it
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $dir = "$env:RUNNER_TEMP\deck90-installed"
          $p = Start-Process -FilePath "dist\Deck-90-$version-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -PassThru -Wait
          if ($p.ExitCode) { throw "setup exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\Deck 90.exe")) { throw 'Deck 90.exe was not installed' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Deck 90.lnk")) { throw 'no Start menu entry' }
          $env:DECK90_SMOKE = '1'
          $env:DECK90_SMOKE_OUT = "$env:RUNNER_TEMP\smoke-installed.txt"
          $s = Start-Process -FilePath "$dir\Deck 90.exe" -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\deck90-smoke2" -PassThru
          $null = $s.Handle
          if (-not $s.WaitForExit(120000)) { Stop-Process -Id $s.Id -Force; throw 'the installed Deck 90 did not finish its start check' }
          $line = Get-Content "$env:RUNNER_TEMP\smoke-installed.txt" -ErrorAction SilentlyContinue
          Write-Host "installed: $line"
          if ("$line" -notmatch 'DECK90_SMOKE ok') { exit 1 }
          New-Item -ItemType Directory -Force "$dir\resources\app-anterior" | Out-Null   # as an update leaves it
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\Deck 90.exe"); $i++) { Start-Sleep 1 }   # the uninstaller finishes from a copy of itself
          if (Test-Path "$dir\Deck 90.exe") { throw 'the uninstaller left Deck 90.exe' }
          if (Test-Path "$dir\resources") { throw 'the uninstaller left the resources folder' }
          Write-Host 'installer: install, start and uninstall ok'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: installer
          path: dist/Deck-90-*-setup.exe
          retention-days: 7

      - name: Updates (install, rescue, damaged package, new engine)
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP\pw" --no-save --no-package-lock --no-audit --no-fund playwright-core@1.64.0
          if ($LASTEXITCODE) { exit 1 }
          $env:PW_DIR = "$env:RUNNER_TEMP\pw"
          node scripts/test-update.mjs "dist\Deck 90-win32-x64"

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      # actions pinned to the commit of their v4.4.0 tag, so a moved tag can't change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 20

      # every push: the scripts must compile, and the program must start and load its page
      - name: Check the scripts
        run: node scripts/check.mjs

      - name: Work out the version and whether it needs a release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = "tag" ] || [ -n "$INPUT_TAG" ]; then
            TAG="${INPUT_TAG:-$REF_NAME}"
            if [ "$TAG" != "v$VERSION" ]; then echo "Tag $TAG does not match package.json $VERSION"; exit 1; fi
            NEEDED=yes
          else
            TAG="v$VERSION"
            # a draft (e.g. left over from an upload through the website) still needs publishing
            DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
            if [ "$DRAFT" = "false" ]; then NEEDED=no; else NEEDED=yes; fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NEEDED=$NEEDED" >> "$GITHUB_ENV"
          echo "$TAG: release needed = $NEEDED"

      - name: Build the Windows and Linux zips
        if: env.NEEDED == 'yes'
        run: |
          node scripts/package.mjs win32
          node scripts/package.mjs linux
          node scripts/package.mjs bundle
          ls -la dist/*.zip dist/*.bundle

      - name: The Windows installer, built and tested on Windows
        if: env.NEEDED == 'yes'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: installer
          path: dist

      - name: Start the Linux build once
        if: env.NEEDED == 'yes'
        run: |
          cd "dist/Deck 90-linux-x64"
          DECK90_SMOKE=1 timeout 90 xvfb-run -a ./deck-90 --no-sandbox --user-data-dir="$RUNNER_TEMP/deck90-smoke" 2>&1 | tee smoke.log
          grep -q "DECK90_SMOKE ok" smoke.log

      - name: Release notes from src/novedades.md (Spanish) and CHANGELOG.md
        if: env.NEEDED == 'yes'
        run: |
          section() { awk -v v="$VERSION" '
            $0 ~ "^## "v" " || $0 == "## "v { on=1; next }
            on && /^## / { exit }
            on { print }' "$1"; }
          {
            es="$(section src/novedades.md)"
            if [ -n "$(printf '%s' "$es" | tr -d '[:space:]')" ]; then
              printf '%s\n\n---\n\n<details><summary>In English</summary>\n\n' "$es"
              section CHANGELOG.md
              printf '\n</details>\n'
            else
              section CHANGELOG.md
            fi
            printf '\n**Windows:** bajá `Deck-90-%s-setup.exe` y abrilo (o el zip, si preferís sin instalar). **Linux:** el zip, y abrí `deck-90`. Si ya lo tenés, Deck 90 te ofrece **INSTALAR** solo.\n' "$VERSION"
          } > notes.md
          cat notes.md

      - name: Publish the release
        if: env.NEEDED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*-setup.exe dist/*.zip dist/*.bundle --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "Deck 90 $TAG" --notes-file notes.md --draft=false --latest
          else
            gh release create "$TAG" dist/*-setup.exe dist/*.zip dist/*.bundle --target "$GITHUB_SHA" --title "Deck 90 $TAG" --notes-file notes.md --latest
          fi

# Builds the Windows and Linux zips and publishes them as a GitHub Release.
# Runs on every push to main: when package.json carries a version that has no
# release yet (bump the version and add its CHANGELOG section), it builds and
# publishes v<version>, creating the tag on that commit. Otherwise it does nothing.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v6.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Work out the version and whether it needs a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ] || [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag || github.ref_name }}"
            if [ "$TAG" != "v$VERSION" ]; then echo "Tag $TAG does not match package.json $VERSION"; exit 1; fi
            NEEDED=yes
          else
            TAG="v$VERSION"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then NEEDED=no; else NEEDED=yes; fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NEEDED=$NEEDED" >> "$GITHUB_ENV"
          echo "$TAG: release needed = $NEEDED"

      - name: Build the Windows and Linux zips
        if: env.NEEDED == 'yes'
        run: |
          node scripts/package.mjs win32
          node scripts/package.mjs linux
          ls -la dist/*.zip

      - name: Release notes from CHANGELOG.md
        if: env.NEEDED == 'yes'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## "v" " || $0 == "## "v { on=1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          printf '\n**Download, unzip, run:** Windows → `Deck 90.exe`, Linux → `deck-90`.\n' >> notes.md
          cat notes.md

      - name: Publish the release
        if: env.NEEDED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "Deck 90 $TAG" --notes-file notes.md --latest
          fi

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="mobile-web-app-capable" content="yes">
<title>Deck 90</title>
<link rel="stylesheet" href="/remote/remote.css">
</head>
<body class="view-all">
<header class="bar">
  <img id="npCover" alt="">
  <div class="np" id="np"><span id="npTitle">DECK 90</span><span id="npArtist">esperando a la PC…</span></div>
  <span class="state" id="state">…</span>
  <button id="btnView" title="Cambiar vista (o deslizá)">◫</button>
  <button id="btnSet" title="Ajustes del celular">⚙</button>
  <button id="btnFull" title="Pantalla completa">⛶</button>
</header>
<div class="prog" id="prog"><div class="prog-fill" id="progFill"></div><span id="progA">0:00</span><span id="progB"></span></div>

<main class="rack">
  <section class="vus">
    <div class="cell"><canvas id="vuL"></canvas></div>
    <div class="cell"><canvas id="vuR"></canvas></div>
  </section>
  <section class="nums">
    <div class="num big"><b id="nM">--.-</b><i>LUFS-M</i></div>
    <div class="num"><b id="nI">--.-</b><i>INTEGRADO</i><i class="spot" id="nSpot"></i></div>
    <div class="num"><b id="nLra">--</b><i>LRA</i></div>
    <div class="num"><b id="nTp">--.-</b><i id="nTpU">TRUE PEAK</i></div>
    <div class="num"><b id="nBpm">--</b><i>BPM</i></div>
    <div class="num"><b id="nPh">--</b><i>FASE</i></div>
  </section>
  <section class="fl"><canvas id="fl"></canvas></section>
  <section class="sg"><canvas id="sg"></canvas></section>
  <section class="tape"><canvas id="tape"></canvas></section>
</main>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <div class="sheet-head">AJUSTES DEL CELULAR <button id="sheetClose">✕</button></div>
    <div class="opt" data-k="vu"><span>VU</span><button data-v="pc">COMO LA PC</button><button data-v="MODERN">STUDIO</button><button data-v="HIFI90">HI-FI 90s</button><button data-v="REEL70">CINTA 70s</button><button data-v="BLUE">AZUL</button><button data-v="COBALT">AZUL INT.</button><button data-v="CREAM">CREMA</button><button data-v="DUO">DÚO</button></div>
    <div class="opt" data-k="tape"><span>CINTA</span><button data-v="pc">COMO LA PC</button><button data-v="REEL">REEL</button><button data-v="CLEAR">CLEAR</button></div>
    <div class="opt" data-k="sens"><span>FL 90s</span><button data-v="pc">COMO LA PC</button><button data-v="0">N</button><button data-v="1">H</button><button data-v="2">MAX</button></div>
    <div class="opt" data-k="flc"><span>COLOR FL</span><button data-v="pc">COMO LA PC</button><button data-v="GREEN">VERDE</button><button data-v="TURQ">TURQUESA</button><button data-v="AMBER">ÁMBAR</button><button data-v="SPEC">SPECTRUM</button><button data-v="SPEC2">CIAN</button></div>
    <div class="opt" data-k="flAll"><span>FL EN “TODO”</span><button data-v="1">SÍ</button><button data-v="0">NO</button></div>
    <div class="opt" data-k="night"><span>MODO NOCHE</span><button data-v="0">NO</button><button data-v="1">SÍ</button></div>
    <div class="opt" data-k="haptic"><span>VIBRAR</span><button data-v="1">SÍ</button><button data-v="0">NO</button></div>
    <div class="sheet-tip">Deslizá a los costados para cambiar de vista: todo · VU · FL 90s · espectrograma · cinta.</div>
  </div>
</div>

<div id="toast"></div>
<canvas id="deck" hidden></canvas>

<script src="/remote/shim.js"></script>
<script src="/js/stills.js"></script>
<script src="/js/deck.js"></script>
<script src="/js/draw-vu.js"></script>
<script src="/js/draw-spectrum.js"></script>
<script src="/js/tape.js"></script>
<script src="/js/nowplaying.js"></script>
<script src="/remote/remote.js"></script>
</body>
</html>
